<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stock Alert</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      width: 320px;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: -10px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 13px;
      color: #cbd5e1;
    }

    input {
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #1e293b;
      color: white;
      font-size: 14px;
    }

    input::placeholder {
      color: #64748b;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #16a34a;
    }

    .status {
      font-size: 13px;
      text-align: center;
      color: #22c55e;
      min-height: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div>
      <h1 class="title">Stock Alert</h1>
      <p class="subtitle">
        Get notified when stock price drops
      </p>
    </div>

    <div class="input-group">
      <label>Stock Symbol</label>
      <input
        type="text"
        id="symbol"
        placeholder="RELIANCE"
      />
    </div>

    <div class="input-group">
      <label>Target Price</label>
      <input
        type="number"
        id="price"
        placeholder="2400"
      />
    </div>

    <button id="saveBtn">
      Set Alert
    </button>

    <div class="status" id="status"></div>

  </div>

  <script src="popup.js"></script>

</body>
</html>
